<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>북 워킹 · 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.1.1"><style>.adm{max-width:960px;margin:0 auto;padding:20px 16px 60px}.adm table{width:100%;border-collapse:collapse;font-size:13px}.adm th{font-family:var(--mono);font-size:11px;font-weight:500;text-align:left;color:var(--mute);border-bottom:2px solid var(--ink);padding:6px 8px 6px 0}.adm td{border-bottom:1px solid var(--hair);padding:8px 8px 8px 0;vertical-align:top}.adm .sec{margin-top:28px}.adm .actions button{margin-right:4px}.scroll{overflow-x:auto}</style></head>
<body><div class="adm"><header class="row" style="justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px"><div><p class="eyebrow">BOOK WALKING · ADMIN</p><h1 style="margin:0;font-size:24px">관리자</h1></div><a href="./">← 서비스로</a></header>
<p id="admMsg" class="msg"></p>
<div id="admBody" hidden>
<div class="metric-strip" id="admMetrics"></div>
<section class="sec"><h2>이용 신청</h2><div class="scroll"><table><thead><tr><th>신청일</th><th>이메일</th><th>닉네임</th><th>상태</th><th></th></tr></thead><tbody id="regRows"></tbody></table></div></section>

<section class="sec"><h2>운영</h2><div class="row" style="flex-wrap:wrap"><button class="ghost" id="btnSync" type="button">두루누비 코스 지금 동기화</button><button class="ghost" id="btnReport" type="button">오늘 운영 리포트 만들기</button><button class="ghost" id="btnRecheck" type="button">AI 잠금 해제</button></div><pre id="opsOut" class="muted" style="white-space:pre-wrap;font-family:var(--mono);font-size:12px"></pre></section>
</div></div>
